name: Daily Sync from Upstream

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch: # allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: release/daily

      - name: Setup Git
        run: |
          git config --global user.name "Mark Hermeling - bot"
          git config --global user.email "mark@hermeling.org"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/wolfssl/wolfssl.git
          git fetch upstream

      - name: Merge upstream into fork
        run: |
          git checkout release/daily
          git merge upstream/master --no-edit || echo "No changes to merge"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} release/daily